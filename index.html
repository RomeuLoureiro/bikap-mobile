<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>BIKAP Mobile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 54px;
            line-height: 1;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 28px;
            color: #ddd;
        }

        .status {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .detail {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }

        .spinner {
            width: 46px;
            height: 46px;
            margin: 0 auto 22px auto;
            border: 5px solid rgba(255,255,255,.18);
            border-top-color: #18a45b;
            border-radius: 50%;
            animation: spin .85s linear infinite;
        }

        .retry {
            display: none;
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #159b55;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <link rel="apple-touch-icon" sizes="180x180" href="./bikap-icon-180.png?v=100">
    <link rel="icon" type="image/png" sizes="192x192" href="./bikap-icon-192.png?v=100">
    <link rel="manifest" href="./manifest.webmanifest?v=100">
    <meta name="apple-mobile-web-app-title" content="BIKAP Mobile">
</head>

<body>
    <div class="box">
        <div class="logo">BIKAP</div>
        <div class="sub">BIKE ASSEMBLY PORTUGAL</div>

        <div class="spinner" id="spinner"></div>

        <div class="status" id="status">
            A ligar ao BIKAP Mobile...
        </div>

        <div class="detail" id="detail">
            A procurar o servidor disponível.
        </div>

        <button
            class="retry"
            id="retry"
            onclick="loadCurrentUrl()"
        >
            TENTAR NOVAMENTE
        </button>
    </div>

    <script>
        const FIXED_BASE_URL = "https://romeuloureiro.github.io/bikap-mobile/";

        function isStandalone() {
            return (
                window.matchMedia("(display-mode: standalone)").matches
                || window.navigator.standalone === true
            );
        }

        function isInstallMode() {
            const params = new URLSearchParams(window.location.search);
            return params.get("install") === "1";
        }

        function showInstallMode() {
            const status = document.getElementById("status");
            const detail = document.getElementById("detail");
            const retry = document.getElementById("retry");
            const spinner = document.getElementById("spinner");

            spinner.style.display = "none";
            retry.style.display = "none";

            status.textContent = "Adicionar BIKAP ao ecrã principal";
            detail.innerHTML = `
                Este endereço é o link fixo do BIKAP.<br><br>
                No iPhone toque em <strong>Partilhar</strong> →
                <strong>Adicionar ao ecrã principal</strong>.<br><br>
                Depois abra sempre o BIKAP por esse novo ícone.
            `;
        }

        async function loadCurrentUrl() {
            const status = document.getElementById("status");
            const detail = document.getElementById("detail");
            const retry = document.getElementById("retry");
            const spinner = document.getElementById("spinner");

            retry.style.display = "none";
            spinner.style.display = "block";

            status.textContent = "A ligar ao BIKAP Mobile...";
            detail.textContent = "A procurar o servidor disponível.";

            try {
                const response = await fetch(
                    FIXED_BASE_URL + "current.json?ts=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Não foi possível ler a ligação atual.");
                }

                const data = await response.json();
                const url = (data.url || "").trim();

                if (
                    !url
                    || !url.startsWith("https://")
                    || !url.includes(".trycloudflare.com")
                ) {
                    throw new Error("Ainda não existe uma ligação Mobile válida.");
                }

                status.textContent = "Ligação encontrada";
                detail.textContent = "A abrir o BIKAP...";

                // Nunca guardar o endereço temporário. Em cada abertura,
                // volta a consultar current.json e usa o túnel atual.
                window.location.replace(url);

            } catch (error) {
                spinner.style.display = "none";
                status.textContent = "BIKAP Mobile indisponível";
                detail.textContent =
                    "O servidor pode estar desligado ou a ligação ainda não foi atualizada.";
                retry.style.display = "block";
            }
        }

        // ?install=1 fica no endereço fixo enquanto é criado o ícone.
        // Quando o ícone é aberto, resolve sempre o túnel atual.
        if (isInstallMode() && !isStandalone()) {
            showInstallMode();
        } else {
            loadCurrentUrl();
        }
    </script>
</body>
</html>
